name: CI

on:
  pull_request:
  push:
    branches: [main]

# Vercel builds every branch on its own (that needs the Supabase env vars), so
# CI only covers what doesn't: lint, types and the parser/selector tests.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
