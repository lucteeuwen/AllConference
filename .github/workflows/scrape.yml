name: Scrape CCIW data

on:
  schedule:
    # Every 5 minutes during the season (Aug–Nov). Each run does a full pass if
    # the last one is over 14 minutes old, and otherwise only looks at matches
    # that are on. When one is, the run stays up for 9 minutes polling just that
    # match every minute (live mode), so the next run is already queued as it ends.
    - cron: "*/5 * * 8-11 *"
    # Rosters and season stats once a day, 5 AM Central.
    - cron: "0 10 * 8-11 *"
  workflow_dispatch:
    inputs:
      rosters:
        description: "Also refresh rosters and season stats"
        type: boolean
        default: false

# Never run two scrapes at once; a new trigger waits for the current one.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 10 * 8-11 *" ] || [ "${{ inputs.rosters }}" = "true" ]; then
            npm run scrape -- --rosters
          elif [ "${{ github.event.schedule }}" = "*/5 * * 8-11 *" ]; then
            npm run scrape -- --auto
          else
            npm run scrape
          fi
