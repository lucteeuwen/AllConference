name: Scrape CCIW data

on:
  schedule:
    # GitHub's own schedule trigger is unreliable below ~15 min on the free
    # tier (observed 2-5h gaps instead of 5 min), so the real 5-minute tick is
    # driven externally via workflow_dispatch with auto=true below. These
    # native schedules are kept as a harmless backstop.
    - cron: "*/5 * * 8-11 *"
    # Rosters and season stats once a day, 5 AM Central.
    - cron: "0 10 * 8-11 *"
  workflow_dispatch:
    inputs:
      rosters:
        description: "Also refresh rosters and season stats"
        type: boolean
        default: false
      auto:
        description: "Internal: set by the external 5-minute pinger, not for manual use"
        type: boolean
        default: false

# Never run two scrapes at once; a new trigger waits for the current one.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MONTH=$(date -u +%-m)
          if [ "${{ inputs.auto }}" = "true" ] && { [ "$MONTH" -lt 8 ] || [ "$MONTH" -gt 11 ]; }; then
            echo "Off season, skipping."
            exit 0
          fi
          if [ "${{ github.event.schedule }}" = "0 10 * 8-11 *" ] || [ "${{ inputs.rosters }}" = "true" ]; then
            npm run scrape -- --rosters
          elif [ "${{ github.event.schedule }}" = "*/5 * * 8-11 *" ] || [ "${{ inputs.auto }}" = "true" ]; then
            npm run scrape -- --auto
          else
            npm run scrape
          fi
